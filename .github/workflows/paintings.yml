name: Fetch paintings
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node web/scripts/fetch-paintings.mjs
      - name: Commit paintings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add web/public/paintings
          git diff --cached --quiet || git commit -m "Add public-domain paintings from Wikimedia Commons"
          git push
