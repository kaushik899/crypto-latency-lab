name: Network probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install aiohttp websockets
      - run: python scripts/probe_network.py | tee probe.json
      - run: echo "$(cat probe.json)" >> $GITHUB_STEP_SUMMARY
